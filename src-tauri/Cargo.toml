[package]
name = "hud"
version = "0.1.0"
description = "Moza Racing HUD"
authors = ["P4WN3D"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
url = "2.2"
tauri-plugin-shell = "2.0.0-rc"

[profile.release]
panic = "abort" # Снижаем размер бинарника
codegen-units = 1
lto = true
opt-level = "s"
